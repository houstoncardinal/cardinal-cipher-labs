<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google tag (gtag.js) — GA4 property G-5WQGDP322T. Page views on in-app navigation
         are recorded by GA4 Enhanced Measurement ("page changes based on browser history events"). -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5WQGDP322T"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-5WQGDP322T');
    </script>
    <!--seo-start-->
    <title>Cardinal Consulting | Web Design, App Development & Digital Growth — Houston, TX</title>
    <meta name="description" content="Cardinal Consulting designs, builds, and grows digital businesses: websites, apps, branding, SEO, social media, AI automation, and technical consulting. Houston, TX. (281) 901-7016." />
    <!--seo-end-->

    <!-- Favicons: Google Search uses a square icon in a multiple of 48px -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/png" href="/android-chrome-192x192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preload" as="image" href="/brand/cardinal-consulting-logo.png" fetchpriority="high" />
    <meta name="theme-color" content="#FFFFFF" />
    <!-- A reload starts at the top (unless the URL points at a #section), instead of
         restoring the old scroll position mid-page -->
    <script>
      if ("scrollRestoration" in history && !location.hash) history.scrollRestoration = "manual";
    </script>
    <!-- Apply saved theme or device preference before first paint — must match src/lib/theme.ts -->
    <script>
      (function () {
        try {
          var p = localStorage.getItem("cc-theme");
          var dark = p === "dark" || (p !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var r = document.documentElement;
          if (dark) r.classList.add("dark");
          r.style.colorScheme = dark ? "dark" : "light";
          document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#0B1020" : "#FFFFFF");
        } catch (e) {}
      })();
    </script>
    <meta name="apple-mobile-web-app-title" content="Cardinal" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>

  <body>
    <!-- Static copies of the React contact forms so Netlify can detect them at deploy time.
         Field names must match src/components/site/ContactForm.tsx. -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden><input type="text" name="name" /><input type="text" name="email" /><input type="text" name="phone" /><input type="text" name="company" /><input type="text" name="service" /><input type="text" name="plan" /><input type="text" name="needs" /><input type="text" name="timeline" /><input type="text" name="budget" /><input type="text" name="source_page" /><input type="text" name="landing_page" /><input type="text" name="referrer" /><input type="text" name="utm_source" /><input type="text" name="utm_medium" /><input type="text" name="utm_campaign" /><input type="text" name="preferred_contact" /><input type="text" name="best_time" /><input type="text" name="expedited" /><textarea name="message"></textarea><input name="bot-field" /></form>
    <form name="contact-page" data-netlify="true" netlify-honeypot="bot-field" hidden><input type="text" name="name" /><input type="text" name="email" /><input type="text" name="phone" /><input type="text" name="company" /><input type="text" name="service" /><input type="text" name="plan" /><input type="text" name="needs" /><input type="text" name="timeline" /><input type="text" name="budget" /><input type="text" name="source_page" /><input type="text" name="landing_page" /><input type="text" name="referrer" /><input type="text" name="utm_source" /><input type="text" name="utm_medium" /><input type="text" name="utm_campaign" /><textarea name="message"></textarea><input name="bot-field" /></form>
    <form name="service-inquiry" data-netlify="true" netlify-honeypot="bot-field" hidden><input type="text" name="name" /><input type="text" name="email" /><input type="text" name="phone" /><input type="text" name="company" /><input type="text" name="service" /><input type="text" name="plan" /><input type="text" name="needs" /><input type="text" name="timeline" /><input type="text" name="budget" /><input type="text" name="source_page" /><input type="text" name="landing_page" /><input type="text" name="referrer" /><input type="text" name="utm_source" /><input type="text" name="utm_medium" /><input type="text" name="utm_campaign" /><textarea name="message"></textarea><input name="bot-field" /></form>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
